<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 PWA 極速連續掃描 App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- HTML5 QR Code Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        #interactive-scanner video {
            object-fit: cover !important;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10 selection:bg-emerald-500 selection:text-white">

    <div class="max-w-md mx-auto px-4 pt-4 space-y-4">
        
        <!-- Header -->
        <header class="flex items-center justify-between glass-panel p-3.5 rounded-2xl border border-white/10 shadow-xl">
            <div class="flex items-center space-x-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-qrcode text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 leading-tight">連續掃描 App</h1>
                    <p class="text-[10px] text-slate-500 font-medium">2026 極速 API 模式</p>
                </div>
            </div>
            
            <button onclick="toggleSettings()" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition flex items-center justify-center">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </header>

        <!-- API Settings Drawer -->
        <div id="settings-card" class="hidden glass-panel p-4 rounded-2xl border border-white/10 space-y-3 text-slate-800 shadow-xl">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-link text-emerald-600"></i> Google Sheet API 網址
                </label>
                <span class="text-[10px] text-slate-400">儲存於本地</span>
            </div>
            <div class="flex gap-2">
                <input type="url" id="api-url-input" placeholder="https://script.google.com/macros/s/AKfycbyqzoDpEuSjduFeyxldTEQY4GSmuPEWXEytMsuyUq1c11fsLjxicKM4EdoEjPSce6lWXg/exec" 
                       class="flex-1 bg-white/80 border border-slate-300 text-xs rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="saveApiUrl()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition">
                    儲存
                </button>
            </div>
        </div>

        <!-- Category Selector -->
        <section class="glass-panel p-3.5 rounded-2xl border border-white/10 shadow-xl space-y-2">
            <div class="text-[11px] font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-tags text-emerald-600"></i> 1. 請選擇紀錄類別
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectCategory('入銀行', this)" 
                        class="cat-btn active-cat bg-emerald-600 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition-all border-2 border-emerald-500">
                    入銀行
                </button>
                <button type="button" onclick="selectCategory('返CAO(有錢)', this)" 
                        class="cat-btn bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-xl transition-all border-2 border-transparent hover:bg-slate-200">
                    返CAO(有錢)
                </button>
                <button type="button" onclick="selectCategory('返CAO(無錢)', this)" 
                        class="cat-btn bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-xl transition-all border-2 border-transparent hover:bg-slate-200">
                    返CAO(無錢)
                </button>
            </div>
        </section>

        <!-- Live Scanner View -->
        <section class="glass-panel p-3.5 rounded-2xl border border-white/10 shadow-xl space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-700 font-bold">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-camera text-emerald-600"></i> 2. 即時鏡頭視訊
                </span>
                <span id="status-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-200 text-slate-600">
                    等待開啟
                </span>
            </div>

            <!-- Scanner Viewport -->
            <div id="interactive-scanner" class="relative w-full aspect-square bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                <div id="camera-placeholder" class="text-center space-y-2 p-4">
                    <i class="fa-solid fa-video-slash text-3xl text-slate-600"></i>
                    <p class="text-xs text-slate-400 font-medium">按下下方按鈕開啟鏡頭</p>
                </div>
            </div>

            <!-- Scanner Actions -->
            <div class="grid grid-cols-1 gap-2">
                <button id="toggle-cam-btn" onclick="startCamera()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-video"></i> 開啟連續掃描鏡頭
                </button>
            </div>
        </section>

        <!-- Realtime Result Display -->
        <section class="glass-panel p-3.5 rounded-2xl shadow-xl border border-white/10 space-y-2">
            <div class="text-[11px] font-bold text-slate-600 uppercase tracking-wider text-center">
                最新掃描結果
            </div>
            <div class="bg-slate-950 rounded-xl p-4 text-white border border-slate-800 text-center shadow-inner">
                <div id="display-combined" class="text-3xl font-black tracking-tight text-emerald-400 font-mono min-h-[40px] flex items-center justify-center">
                    ---
                </div>
            </div>
        </section>

        <!-- USB Scanner / Manual Fallback -->
        <section class="glass-panel p-3.5 rounded-2xl shadow-xl border border-white/10 space-y-2 text-slate-800">
            <details class="text-xs font-bold text-slate-600 cursor-pointer">
                <summary class="flex items-center gap-1.5 focus:outline-none">
                    <i class="fa-solid fa-keyboard text-emerald-600"></i> 備用：手動輸入 / USB 掃描槍
                </summary>
                <div class="pt-2 flex gap-2">
                    <input type="number" id="manual-code" placeholder="請輸入 1-3000 號碼" 
                           class="flex-1 bg-white border border-slate-300 text-xs rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                           onkeypress="if(event.key==='Enter') submitManualCode()">
                    <button onclick="submitManualCode()" class="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-slate-700 transition">
                        送出
                    </button>
                </div>
            </details>
        </section>

        <!-- History Log -->
        <section class="glass-panel p-3.5 rounded-2xl shadow-xl border border-white/10 space-y-2 text-slate-800">
            <div class="flex justify-between items-center text-xs font-bold text-slate-600">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-clock-rotate-left text-emerald-600"></i> 近期記錄</span>
                <span id="history-count" class="text-[10px] text-slate-400">0 筆記錄</span>
            </div>
            <div id="history-list" class="space-y-1.5 max-h-40 overflow-y-auto pr-1 text-xs">
                <div class="text-center text-slate-400 py-3 italic text-[11px]">尚無掃描記錄</div>
            </div>
        </section>

    </div>

    <script>
        let html5QrCode = null;
        let selectedCategory = "入銀行";
        let lastCode = "";
        let lastTime = 0;
        let historyLogs = [];

        // Initialize state
        window.onload = function() {
            const savedUrl = localStorage.getItem("gas_api_url_2026");
            if (savedUrl) {
                document.getElementById("api-url-input").value = savedUrl;
            }
        };

        function toggleSettings() {
            const card = document.getElementById("settings-card");
            card.classList.toggle("hidden");
        }

        function saveApiUrl() {
            const url = document.getElementById("api-url-input").value.trim();
            if (url) {
                localStorage.setItem("gas_api_url_2026", url);
                updateStatus("網址已儲存", "bg-emerald-600 text-white");
                toggleSettings();
            } else {
                alert("請填寫有效的 API 網址");
            }
        }

        function getApiUrl() {
            return document.getElementById("api-url-input").value.trim() || localStorage.getItem("gas_api_url_2026") || "";
        }

        function selectCategory(catName, btn) {
            selectedCategory = catName;
            document.querySelectorAll(".cat-btn").forEach(b => {
                b.className = "cat-btn bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-xl transition-all border-2 border-transparent hover:bg-slate-200";
            });
            btn.className = "cat-btn active-cat bg-emerald-600 text-white font-bold text-xs py-2.5 rounded-xl shadow-md transition-all border-2 border-emerald-500";
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 1000;
                gain.gain.value = 0.25;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                setTimeout(() => { osc.stop(); ctx.close(); }, 120);
            } catch(e) {}
        }

        function startCamera() {
            const apiUrl = getApiUrl();
            if (!apiUrl) {
                alert("請先點擊右上角⚙️設定，貼上您的 Google Apps Script API 網址！");
                toggleSettings();
                return;
            }

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("interactive-scanner");
            }

            const placeholder = document.getElementById("camera-placeholder");
            if (placeholder) placeholder.style.display = "none";

            const config = { fps: 15, qrbox: { width: 220, height: 220 } };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                const btn = document.getElementById("toggle-cam-btn");
                btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2";
                btn.innerHTML = '<i class="fa-solid fa-video-slash"></i> 關閉鏡頭';
                btn.onclick = stopCamera;
                updateStatus("掃描中...", "bg-emerald-600 text-white");
            })
            .catch(err => {
                console.error(err);
                alert("無法啟動相機，請確認瀏覽器已給予權限！");
                if (placeholder) placeholder.style.display = "block";
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    const btn = document.getElementById("toggle-cam-btn");
                    btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2";
                    btn.innerHTML = '<i class="fa-solid fa-video"></i> 開啟連續掃描鏡頭';
                    btn.onclick = startCamera;
                    updateStatus("已停止", "bg-slate-200 text-slate-600");
                    const placeholder = document.getElementById("camera-placeholder");
                    if (placeholder) placeholder.style.display = "block";
                });
            }
        }

        function onScanSuccess(decodedText) {
            const now = Date.now();
            if (decodedText === lastCode && (now - lastTime) < 2000) {
                return; // Anti-shake / debounce
            }

            lastCode = decodedText;
            lastTime = now;

            playBeep();
            if (navigator.vibrate) navigator.vibrate(100);

            processAndWriteData(decodedText);
        }

        function submitManualCode() {
            const input = document.getElementById("manual-code");
            const val = input.value.trim();
            if (!val) return;
            processAndWriteData(val);
            input.value = "";
        }

        function processAndWriteData(qrCode) {
            const apiUrl = getApiUrl();
            const currentCat = selectedCategory;

            const combinedText = `${qrCode} ${currentCat}`;
            document.getElementById("display-combined").innerText = combinedText;

            updateStatus("寫入中...", "bg-amber-500 text-white");

            const payload = {
                qrCode: qrCode,
                name: currentCat
            };

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    updateStatus("寫入成功", "bg-emerald-600 text-white");
                    addHistoryLog(qrCode, currentCat, true);
                } else {
                    updateStatus("寫入失敗", "bg-rose-600 text-white");
                    addHistoryLog(qrCode, currentCat, false);
                }
            })
            .catch(err => {
                console.error("Network error:", err);
                updateStatus("連線錯誤", "bg-rose-600 text-white");
                addHistoryLog(qrCode, currentCat, false);
            });
        }

        function updateStatus(text, bgClass) {
            const badge = document.getElementById("status-badge");
            if (!badge) return;
            badge.innerText = text;
            badge.className = `px-2.5 py-0.5 rounded-full text-[10px] font-bold ${bgClass}`;
        }

        function addHistoryLog(code, category, isSuccess) {
            const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            historyLogs.unshift({ code, category, isSuccess, time: nowStr });
            if (historyLogs.length > 20) historyLogs.pop();

            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById("history-list");
            document.getElementById("history-count").innerText = `${historyLogs.length} 筆記錄`;

            if (historyLogs.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-3 italic text-[11px]">尚無掃描記錄</div>`;
                return;
            }

            container.innerHTML = historyLogs.map(item => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-slate-100/80 border border-slate-200">
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full ${item.isSuccess ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        <span class="font-mono font-bold text-slate-800">${item.code}</span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 font-bold">${item.category}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-mono">${item.time}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
