<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>基督教宣道會社會服務處有限公司</title>

    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- HTML5 QR Code Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        #qr-reader video {
            object-fit: cover !important;
            border-radius: 1rem;
            width: 100% !important;
            height: 100% !important;
        }

        #qr-reader__scan_region {
            border-radius: 1rem;
            overflow: hidden;
            background-color: #000;
        }

        /* Continuous scan line animation */
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
            box-shadow: 0 0 15px #3b82f6, 0 0 8px #60a5fa;
            animation: scanAnimation 2s infinite ease-in-out;
            z-index: 20;
        }

        @keyframes scanAnimation {
            0% { top: 5%; opacity: 0.3; }
            50% { top: 90%; opacity: 1; }
            100% { top: 5%; opacity: 0.3; }
        }

        /* Pulse glow effect on valid scan */
        .scan-success-flash {
            animation: flashGreen 0.4s ease-out;
        }

        @keyframes flashGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            50% { box-shadow: 0 0 30px 10px rgba(16, 185, 129, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-3 sm:p-5 flex justify-center items-start">

    <div class="w-full max-w-md mx-auto space-y-3.5">
        
        <!-- Header Bar -->
        <header class="glass-panel p-3.5 rounded-2xl shadow-xl border border-white/20 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-qrcode text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-800 leading-tight">宣道會社會服務處 - 01收集站 v1.0</h1>
                    <!-- <p class="text-xs text-slate-500 font-medium">1-5000 極速連續掃描器</p> -->
                </div>
            </div>
            <!-- <button onclick="toggleConfigModal(true)" title="設定 API 網址" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition active:scale-95 border border-slate-200">
                <i class="fa-solid fa-gear text-lg"></i>
            </button> -->
        </header>

        <!-- Category Picker (需求 2 & 6: 開啟後預設「入銀行」，中途可隨時更改) -->
        <!-- <section class="glass-panel p-3.5 rounded-2xl shadow-lg border border-white/20 space-y-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center justify-between">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-tags text-blue-500"></i> 請選擇處理方法</span>
                <span class="text-[10px] text-blue-600 font-normal bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200">可隨時切換</span>
            </label>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectCategory('入銀行')" id="cat-btn-bank" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-blue-600 bg-blue-600 text-white shadow-md shadow-blue-500/20 active:scale-95">
                    入銀行
                </button>
                <button type="button" onclick="selectCategory('返CAO(有錢)')" id="cat-btn-cao-cash" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95">
                    返CAO(有錢)
                </button>
                <button type="button" onclick="selectCategory('返CAO(無錢)')" id="cat-btn-cao-nocash" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95">
                    返CAO(無錢)
                </button>
            </div>
        </section>-->

        <!-- Live Camera Viewfinder (需求 3: 背面鏡頭 + 限制 1-5000) -->
        <section id="camera-card" class="glass-panel p-3.5 rounded-2xl shadow-xl border border-white/20 space-y-3 transition-all duration-300">
		            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectCategory('入銀行')" id="cat-btn-bank" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-blue-600 bg-blue-600 text-white shadow-md shadow-blue-500/20 active:scale-95">
                    入銀行
                </button>
                <button type="button" onclick="selectCategory('返CAO(有錢)')" id="cat-btn-cao-cash" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95">
                    返CAO(有錢)
                </button>
                <button type="button" onclick="selectCategory('返CAO(無錢)')" id="cat-btn-cao-nocash" 
                    class="category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95">
                    返CAO(無錢)
                </button>
            </div>
            <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-black flex items-center justify-center shadow-inner">
                <!-- Scan Line Animation -->
                <div id="scan-line" class="scanner-line hidden"></div>
                
                <div id="qr-reader" class="w-full h-full"></div>
                
                <div id="scan-placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center text-slate-400 bg-slate-900/95 z-10">
                    <div class="w-16 h-16 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center mb-3">
                        <i class="fa-solid fa-camera text-3xl"></i>
                    </div>
                    <p class="font-bold text-slate-200 text-base mb-1">準備就緒</p>
                    <p class="text-xs text-slate-400 max-w-[220px]">點擊下方按鈕啟動背面鏡頭開始自動連續掃描</p>
                </div>
            </div>

            <!-- Camera Controls -->
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-start-cam" onclick="startCamera()" class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20">
                    <i class="fa-solid fa-video"></i> 開啟連續鏡頭
                </button>
                <button id="btn-stop-cam" onclick="stopCamera()" disabled class="w-full py-3 px-4 rounded-xl font-bold text-sm bg-slate-200 text-slate-400 cursor-not-allowed transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-power-off"></i> 關閉鏡頭
                </button>
            </div>
        </section>

        <!-- Realtime Result Display (需求 3.5 & 5: 即時顯示例如 "1001 入銀行" 並可自動連續掃描) -->
        <section class="glass-panel p-4 rounded-2xl shadow-lg border border-white/20 space-y-2">


            <div class="bg-slate-900/90 rounded-xl p-3.5 text-white border border-slate-700/50 flex items-center justify-between shadow-inner">
                <div class="space-y-0.5">
                    <!--<div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">目前結果</div>-->
                    <!-- Combined Format e.g., "1001 入銀行" -->
                    <div id="display-combined" class="text-2xl font-black tracking-tight text-emerald-400 font-mono">
                        ---
                    </div>
                </div>
                <div class="text-right border-l border-slate-700/80 pl-4">
                    <!--<span class="text-[10px] text-slate-400 block font-bold">累計成功寫入</span>-->
                    <span id="total-scans" class="text-xl font-black text-blue-400">0</span> <span class="text-xs text-slate-400">筆</span>
                </div>
            </div>
			<div class="flex justify-between items-center">
                <!--<span class="text-xs font-bold text-slate-500 uppercase tracking-wider">最新讀取與處理結果</span>-->
                <span id="status-badge" class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-600">
                    <!--等待掃描中-->
                </span>
            </div>
        </section>

        <!-- Scanned Records History -->
        <section class="glass-panel p-3.5 rounded-2xl shadow-lg border border-white/20 space-y-2">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">即時掃描記錄流水帳</span>
                <!--<button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-slate-600">清除記錄</button>-->
            </div>
            <ul id="history-list" class="space-y-1.5 max-h-40 overflow-y-auto pr-1 text-xs">
                <li class="text-slate-400 text-center py-3 italic">尚無掃描記錄，對準 1-5000 QR Code 即可自動感應</li>
            </ul>
        </section>

    </div>

    <!-- API Config Modal -->
    <div id="config-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                    <i class="fa-solid fa-link text-blue-600"></i> 設定 Google Sheet Web App 網址
                </h3>
                <button onclick="toggleConfigModal(false)" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-2">
                <p class="text-xs text-slate-500 leading-relaxed">
                    請貼上 Google Apps Script 發佈後的 <strong>Web App URL</strong> (/exec 結尾)。
                </p>
                <textarea id="input-api-url" rows="3" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="saveApiUrl()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-sm shadow-md shadow-blue-500/20 active:scale-95 transition">
                    儲存並開啟掃描
                </button>
            </div>
        </div>
    </div>

    <!-- UI Toast Notification Box -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-0 translate-y-5 pointer-events-none z-50 max-w-xs text-center"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // 💡 請將下方引號內的網址替換為您的 Google Sheet Web App 網址 (/exec 結尾)
        const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbwRagqZk9zR0vWklq5OOkpHnZBGpJnRwBZ4JZdhQdmOEVoOjt09Pg5lF7rziGyYdyeo/exec";

        let html5QrCode = null;
        let selectedCategory = "入銀行"; // 需求 2: 預設選取「入銀行」
        let lastScannedCode = "";
        let lastScannedTime = 0;
        let totalScanCount = 0;
        let isProcessing = false;

        // 取得當前使用的 API 網址 (優先使用瀏覽器自訂設定，否則使用內建預設值)
        function getApiUrl() {
            return localStorage.getItem("gas_scanner_api_url") || DEFAULT_API_URL;
        }

        window.onload = function() {
            const currentUrl = getApiUrl();
            document.getElementById("input-api-url").value = currentUrl;
            
            // 只有當內建網址尚未填寫時，才自動彈出設定視窗
            if (!currentUrl || currentUrl.includes("YOUR_SCRIPT_ID_HERE")) {
                toggleConfigModal(true);
            }
        };

        function toggleConfigModal(show) {
            document.getElementById("config-modal").classList.toggle("hidden", !show);
        }

        function saveApiUrl() {
            const url = document.getElementById("input-api-url").value.trim();
            if (!url.startsWith("https://script.google.com")) {
                showToast("⚠️ 請貼上有效的 Google Script Web App (/exec) 網址", "bg-amber-500 text-white");
                return;
            }
            localStorage.setItem("gas_scanner_api_url", url);
            toggleConfigModal(false);
            showToast("✅ API 網址已儲存，可開始掃描！", "bg-emerald-600 text-white");
        }

        function selectCategory(categoryName) {
            selectedCategory = categoryName;

            // Reset button styles
            const btnBank = document.getElementById("cat-btn-bank");
            const btnCash = document.getElementById("cat-btn-cao-cash");
            const btnNoCash = document.getElementById("cat-btn-cao-nocash");

            const activeStyle = "category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-blue-600 bg-blue-600 text-white shadow-md shadow-blue-500/20 active:scale-95";
            const inactiveStyle = "category-btn py-3 px-1 rounded-xl font-bold text-xs sm:text-sm text-center transition border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 active:scale-95";

            btnBank.className = categoryName === "入銀行" ? activeStyle : inactiveStyle;
            btnCash.className = categoryName === "返CAO(有錢)" ? activeStyle : inactiveStyle;
            btnNoCash.className = categoryName === "返CAO(無錢)" ? activeStyle : inactiveStyle;

            showToast(`已切換處理方法為：${categoryName}`, "bg-blue-600 text-white");
        }

        function playBeepSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = "sine";
                // Bright high-pitch beep for clear feedback
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {
                console.warn("Audio Context playback error:", e);
            }
        }

        function startCamera() {
            const apiUrl = getApiUrl();
            if (!apiUrl || apiUrl.includes("YOUR_SCRIPT_ID_HERE")) {
                showToast("⚠️ 請先設定 Google Sheet API 網址", "bg-amber-500 text-white");
                toggleConfigModal(true);
                return;
            }

            if (typeof Html5Qrcode === 'undefined') {
                showToast("❌ 掃描模組載入中，請稍後再試", "bg-rose-600 text-white");
                return;
            }

            document.getElementById("scan-placeholder").classList.add("hidden");
            document.getElementById("scan-line").classList.remove("hidden");

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("qr-reader");
            }

            const config = {
                fps: 20, // Higher FPS for ultra-fast response
                qrbox: { width: 230, height: 230 },
                aspectRatio: 1.0
            };

            // facingMode: "environment" enforces mobile back camera
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                document.getElementById("btn-start-cam").disabled = true;
                document.getElementById("btn-start-cam").className = "w-full py-3 px-4 rounded-xl font-bold text-sm bg-slate-200 text-slate-400 cursor-not-allowed flex items-center justify-center gap-2";
                
                document.getElementById("btn-stop-cam").disabled = false;
                document.getElementById("btn-stop-cam").className = "w-full py-3 px-4 rounded-xl font-bold text-sm bg-rose-600 hover:bg-rose-500 text-white active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-rose-600/20";
                //updateStatus("對焦連續掃描中", "bg-emerald-500 text-white");
                updateStatus("", "bg-emerald-500 text-white");
            })
            .catch(err => {
                console.error("Camera start error:", err);
                document.getElementById("scan-placeholder").classList.remove("hidden");
                document.getElementById("scan-line").classList.add("hidden");
                showToast("❌ 鏡頭開啟失敗：請允許瀏覽器使用相機權限", "bg-rose-600 text-white");
            });
        }

        function stopCamera() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById("scan-placeholder").classList.remove("hidden");
                    document.getElementById("scan-line").classList.add("hidden");

                    document.getElementById("btn-start-cam").disabled = false;
                    document.getElementById("btn-start-cam").className = "w-full py-3 px-4 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20";
                    
                    document.getElementById("btn-stop-cam").disabled = true;
                    document.getElementById("btn-stop-cam").className = "w-full py-3 px-4 rounded-xl font-bold text-sm bg-slate-200 text-slate-400 cursor-not-allowed flex items-center justify-center gap-2";
                    //updateStatus("鏡頭已關閉", "bg-slate-200 text-slate-600");
                    updateStatus("", "bg-slate-200 text-slate-600");
                });
            }
        }

        function onScanSuccess(decodedText) {
            const now = Date.now();

            // Prevent rapid continuous duplicate triggering of the exact same code within 1.8 seconds
            if (decodedText === lastScannedCode && (now - lastScannedTime) < 1800) {
                return;
            }

            const rawVal = decodedText.trim();
            const numVal = parseInt(rawVal, 10);

            // 需求 3: QR-Code 只接受 1-5000 的數值
            if (!isNaN(numVal) && numVal >= 1 && numVal <= 5000) {
                lastScannedCode = decodedText;
                lastScannedTime = now;

                // 需求 4: 成功 scan 後有聲響提示
                playBeepSound();
                if (navigator.vibrate) navigator.vibrate(80);

                // Visual flash effect
                const cameraCard = document.getElementById("camera-card");
                cameraCard.classList.add("scan-success-flash");
                setTimeout(() => cameraCard.classList.remove("scan-success-flash"), 400);

                // Send data in background without blocking camera feed (需求 5: 不用按任何鈕即可繼續 scan)
                processAndWriteData(rawVal);
            }
        }

        function processAndWriteData(qrCode) {
            const apiUrl = getApiUrl();
            const currentCat = selectedCategory; // Captures category at exact moment of scan

            // 需求 3.5: 顯示例如 "1001 入銀行"
            const combinedText = `${qrCode} ${currentCat}`;
            document.getElementById("display-combined").innerText = combinedText;

            updateStatus("", "bg-amber-500 text-white");

            const payload = {
                qrCode: qrCode,
                method: currentCat
            };

            fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    totalScanCount++;
                    document.getElementById("total-scans").innerText = totalScanCount;
                    updateStatus("", "bg-emerald-600 text-white");
                    addHistoryLog(qrCode, currentCat, true);
                } else {
                    updateStatus("", "bg-rose-600 text-white");
                    addHistoryLog(qrCode, currentCat, false);
                }
            })
            .catch(err => {
                console.error("Network error:", err);
                updateStatus("", "bg-rose-600 text-white");
                addHistoryLog(qrCode, currentCat, false);
            });
        }

        function updateStatus(text, bgClass) {
            const badge = document.getElementById("status-badge");
            badge.innerText = text;
            badge.className = `px-2.5 py-1 rounded-full text-xs font-bold ${bgClass}`;
        }

        function addHistoryLog(code, category, isSuccess) {
            const list = document.getElementById("history-list");
            if (list.querySelector("li") && list.querySelector("li").innerText.includes("尚無掃描記錄")) {
                list.innerHTML = "";
            }

            const timeStr = new Date().toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const li = document.createElement("li");
            li.className = "flex justify-between items-center bg-white/80 p-2 rounded-xl border border-slate-100 shadow-sm font-mono";
            
            li.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="font-black text-slate-800 text-sm">${code}</span>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${getCategoryBadgeStyle(category)}">${category}</span>
                </div>
                <div class="flex items-center gap-2 text-[11px]">
                    <span class="text-slate-400 font-sans">${timeStr}</span>
                    <span class="${isSuccess ? 'text-emerald-600' : 'text-rose-600'} font-bold">${isSuccess ? '' : ''}</span>
                </div>
            `;
            list.insertBefore(li, list.firstChild);
        }

        function getCategoryBadgeStyle(category) {
            if (category === "入銀行") return "bg-blue-100 text-blue-700";
            if (category === "返CAO(有錢)") return "bg-amber-100 text-amber-800";
            return "bg-slate-100 text-slate-700";
        }

        function clearHistory() {
            document.getElementById("history-list").innerHTML = '<li class="text-slate-400 text-center py-3 italic">尚無掃描記錄，對準 1-5000 QR Code 即可自動感應</li>';
        }

        function showToast(msg, bgClass) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-100 translate-y-0 z-50 ${bgClass}`;
            setTimeout(() => {
                toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-0 translate-y-5 pointer-events-none z-50 ${bgClass}`;
            }, 2500);
        }
    </script>
</body>
